[package]
name = "etsi-020-ref-impl"
version = "0.1.0"
edition = "2021"
default-run = "server"

[lib]
name = "ref_impl_lib"
path = "src/lib.rs"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
actix-web = {version = "4.13.0", features = ["openssl"]}
base64 = "0.22.1"
tracing = "=0.1.41"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
openssl = { version = "0.10.79" }
uuid = { version = "1.23.1", features = ["serde", "v7"] }
url = { version = "2.5.8", features = ["serde"] }
tokio = { version = "1.52.2", features = ["full", "time"] }
reqwest = "0.13.3"
